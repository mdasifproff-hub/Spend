<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spend Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F6B57">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#EEF2F6;--surface:#fff;--ink:#14202B;--mute:#5B6B7A;--line:#DCE3EA;--accent:#0F6B57;--accent-ink:#fff;--warn:#C2410C;--track:#E3E9EF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1620;--surface:#16212D;--ink:#E8EEF4;--mute:#93A4B4;--line:#243241;--accent:#3CC2A0;--accent-ink:#06231C;--warn:#FB923C;--track:#223140;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1620;--surface:#16212D;--ink:#E8EEF4;--mute:#93A4B4;--line:#243241;--accent:#3CC2A0;--accent-ink:#06231C;--warn:#FB923C;--track:#223140;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;padding:18px 16px 120px}
h1{font-size:22px;font-weight:800;margin:4px 0 14px;letter-spacing:-.01em}
h2{font-size:15px;font-weight:700;margin:26px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero{padding:20px 18px}
.today{margin-top:12px;padding:14px 18px}.tv{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.lbl{color:var(--mute);font-size:14px;margin:0}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
.big{font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;margin:2px 0 14px}
.big.over{color:var(--warn)}.big.ok{color:var(--accent)}
.bar{position:relative;height:12px;border-radius:6px;background:var(--track)}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bar.over>i{background:var(--warn)}
.bar>b{position:absolute;top:-5px;width:2px;height:22px;background:var(--ink);border-radius:1px}
.rw{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.grow{flex:1;min-width:0}
.split{display:flex;justify-content:space-between;gap:8px}
.mini{height:5px;border-radius:3px;background:var(--track);margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--track);margin-bottom:6px}
.stack i{display:block;height:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.arm{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.chip:focus-visible,.tabs a:focus-visible,.banner:focus-visible,.field:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.banner{display:block;width:100%;text-align:left;margin-bottom:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--accent);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;margin-top:8px}
.field{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:500;font-size:16px}
.amt{display:flex;align-items:baseline;gap:8px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.amt span{font-size:28px;color:var(--mute);font-weight:700}
.amt input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font-weight:800;font-size:44px;outline:0;font-variant-numeric:tabular-nums}
.amt input::-webkit-outer-spin-button,.amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--track)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{padding:14px}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.nav h1{margin:0}
.nav .btn{min-width:44px;min-height:44px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs a{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;color:var(--mute);text-decoration:none;font-weight:600;font-size:15px}
.tabs a[aria-current=page]{color:var(--ink);background:var(--track)}
.tabs a.plus{background:var(--accent);color:var(--accent-ink);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:9;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}.chk input{width:22px;height:22px;accent-color:var(--accent)}
.ex .btn{flex:1}
@media print{:root:root:root{--bg:#fff;--surface:#fff;--ink:#14202B;--mute:#5B6B7A;--line:#DCE3EA;--accent:#0F6B57;--warn:#C2410C;--track:#E3E9EF}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.tabs,.toast,.noprint,.nav .btn,.banner,.rw .btn{display:none!important}#app{padding:0;max-width:none}.card{break-inside:avoid}}
svg text{font-family:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>
<nav class="tabs" aria-label="Main"><div>
<a href="#home" data-v="home">Home</a><a href="#add" data-v="add" class="plus">+ Add</a><a href="#report" data-v="report">Report</a><a href="#setup" data-v="setup">Setup</a>
</div></nav>
<script>
(function(){
const KEY='spend-tracker-v1';
const COLORS=['#2F6FED','#E0A100','#0F9D74','#D9480F','#8B5CF6','#DB2777','#0891B2','#64748B','#65A30D','#B45309'];
const DEF=['Food & dining','Groceries','Transport','Bills & utilities','Shopping','Health','Entertainment','Other'];
let S,armed=null,addCat=null,rm='',keepRm=false,lastView='',now=new Date(),tt;
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const mk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1);
const today=()=>{const d=new Date();return mk(d)+'-'+p2(d.getDate())};
const loc=()=>S.cur==='INR'?'en-IN':'en-US';
const fmt=n=>new Intl.NumberFormat(loc(),{style:'currency',currency:S.cur,minimumFractionDigits:0,maximumFractionDigits:2}).format(n);
const sym=()=>new Intl.NumberFormat(loc(),{style:'currency',currency:S.cur}).formatToParts(0).find(p=>p.type==='currency').value;
const mdate=m=>new Date(+m.slice(0,4),+m.slice(5,7)-1,1);
const mlabel=m=>mdate(m).toLocaleDateString('en',{month:'long',year:'numeric'});
const mname=m=>mdate(m).toLocaleDateString('en',{month:'long'});
const dim=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const sdate=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)).toLocaleDateString('en',{day:'numeric',month:'short'});
const shift=(m,n)=>{const d=mdate(m);d.setMonth(d.getMonth()+n);return mk(d)};
const sum=l=>l.reduce((a,e)=>a+e.amt,0);
const mex=m=>S.exp.filter(e=>e.date.startsWith(m));
const cat=id=>S.cats.find(c=>c.id===id)||{name:'Uncategorised',color:'#64748B'};
const byCat=l=>{const m={};l.forEach(e=>m[e.cat]=(m[e.cat]||0)+e.amt);return Object.entries(m).map(([id,v])=>({c:cat(id),v})).sort((a,b)=>b.v-a.v)};
function init(force){let d=null;if(!force){try{const r=localStorage.getItem(KEY);if(r)d=JSON.parse(r)}catch(e){}}
S=d||{budget:0,cur:'INR',cats:DEF.map((n,i)=>({id:'c'+i,name:n,color:COLORS[i]})),exp:[],seen:''}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2300)}
function arm(btn,key,fn){if(armed===key){armed=null;fn();return}armed=key;const t=btn.textContent;btn.textContent='Sure?';btn.classList.add('arm');
setTimeout(()=>{if(armed===key){armed=null;btn.textContent=t;btn.classList.remove('arm')}},2500)}

function home(){
const m=mk(now),l=mex(m),spent=sum(l),b=S.budget,D=dim(m),day=now.getDate();
let h;
if(!b)h=`<div class="card hero"><p class="lbl">${mlabel(m)}</p><div class="big">${fmt(spent)}</div><p class="lbl">spent so far. Set a monthly budget to see how much is left.</p><p style="margin:14px 0 0"><a class="btn" href="#setup">Set monthly budget</a></p></div>`;
else{const left=b-spent,over=left<0,pct=Math.min(100,spent/b*100),tick=day/D*100,diff=spent-b*day/D,pd=left/(D-day+1);
h=`<div class="card hero"><p class="lbl">${over?'Over budget by':'Left to spend in '+mname(m)}</p><div class="big ${over?'over':'ok'}">${fmt(Math.abs(left))}</div><div class="bar ${over?'over':''}"><i style="width:${pct}%"></i><b style="left:calc(${tick}% - 1px)"></b></div><p class="lbl" style="margin:14px 0 0">${fmt(spent)} of ${fmt(b)} spent. ${diff>0?fmt(diff)+' ahead of an even pace.':fmt(-diff)+' under an even pace.'}</p>${over?'':`<p class="lbl" style="margin:4px 0 0">About ${fmt(pd)} a day for the next ${D-day+1} days.</p>`}<p class="note">The vertical line marks an even pace for today.</p></div>`}
const pm=shift(m,-1);let bn='';
if(S.seen!==pm&&mex(pm).length)bn=`<button class="banner" data-act="openprev">${mname(pm)}’s report is ready. Tap to view it.</button>`;
else if(day>=D-1&&spent>0)bn=`<a class="banner" href="#report">The month ends soon. Preview this month’s report.</a>`;
const cs=byCat(l),mx=cs[0]?cs[0].v:1;
const ch=cs.length?cs.map(x=>`<div class="rw"><i class="dot" style="background:${x.c.color}"></i><div class="grow"><div class="split"><span>${esc(x.c.name)}</span><b>${fmt(x.v)}</b></div><div class="mini"><i style="width:${x.v/mx*100}%;background:${x.c.color}"></i></div></div></div>`).join(''):`<p class="lbl">Nothing logged yet this month. Tap Add to log your first expense.</p>`;
const rec=[...S.exp].sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts).slice(0,8);
const rh=rec.length?rec.map(e=>`<div class="rw"><i class="dot" style="background:${cat(e.cat).color}"></i><div class="grow"><div>${esc(cat(e.cat).name)}</div><div class="note" style="margin:0">${sdate(e.date)}${e.note?': '+esc(e.note):''}</div></div><b>${fmt(e.amt)}</b><button class="btn ghost sm" data-act="del" data-id="${e.id}" aria-label="Delete expense">×</button></div>`).join(''):`<p class="lbl">Your latest expenses will show here.</p>`;
const td=today(),tdl=S.exp.filter(e=>e.date===td),tds=sum(tdl);
return bn+h+`<div class="card today"><div class="split"><div><p class="lbl">Spent today</p><div class="tv">${fmt(tds)}</div></div><p class="note" style="text-align:right;margin:0">${sdate(td)}<br>${tdl.length} expense${tdl.length===1?'':'s'}</p></div></div><h2>This month by category</h2><div class="card">${ch}</div><h2>Recent expenses</h2><div class="card">${rh}</div><p class="note">To fix an older entry, open Report, pick the month and scroll to All expenses.</p>`}

function totText(){const t=today();return 'Today: '+fmt(sum(S.exp.filter(e=>e.date===t)))+'. This month: '+fmt(sum(mex(mk(new Date()))))+'.'}
function add(){
if(!S.cats.find(c=>c.id===addCat))addCat=S.cats[0]?S.cats[0].id:null;
return `<h1>Add expense</h1><label class="amt"><span>${esc(sym())}</span><input id="amt" type="number" inputmode="decimal" step="any" min="0" placeholder="0" autocomplete="off" aria-label="Amount"></label>
<div class="chips">${S.cats.map(c=>`<button class="chip ${c.id===addCat?'on':''}" data-act="pick" data-id="${c.id}"><i class="dot" style="background:${c.color}"></i>${esc(c.name)}</button>`).join('')}</div>
<input id="note" class="field" maxlength="60" placeholder="Note (optional)" aria-label="Note">
<div class="row"><input id="date" class="field" type="date" value="${today()}" max="${today()}" aria-label="Date"><button class="btn" data-act="save">Add expense</button></div>
<p class="note" id="tot">${totText()}</p><p style="margin:18px 0 0"><a class="btn ghost" href="#home">Done</a></p>`}
function saveExp(){
const a=parseFloat($('#amt').value);
if(!(a>0)){toast('Enter an amount first');$('#amt').focus();return}
if(!addCat){toast('Add a category in Setup first');return}
S.exp.push({id:'e'+Date.now(),amt:Math.round(a*100)/100,cat:addCat,note:$('#note').value.trim(),date:$('#date').value||today(),ts:Date.now()});
save();toast('Added '+fmt(a)+' to '+cat(addCat).name);
$('#amt').value='';$('#note').value='';$('#amt').focus();$('#tot').textContent=totText()}

function report(){
const m=rm,l=mex(m),spent=sum(l),b=S.budget,D=dim(m),cur=m===mk(now),days=cur?now.getDate():D;
if(m<mk(now)&&S.seen<m){S.seen=m;save()}
const nav=`<div class="nav"><button class="btn ghost sm" data-act="prevm" aria-label="Previous month">‹</button><h1>${mlabel(m)}</h1><button class="btn ghost sm" data-act="nextm" ${cur?'disabled':''} aria-label="Next month">›</button></div>`;
if(!l.length)return nav+`<div class="card"><p class="lbl">No expenses logged in ${mlabel(m)}.</p></div>`+exportCard();
let v;
if(b){const d=b-spent,o=d<0;v=`<div class="card hero"><p class="lbl">${cur?'So far this month':'Month result'}</p><div class="big ${o?'over':'ok'}">${o?'Over by ':'Under by '}${fmt(Math.abs(d))}</div><p class="lbl" style="margin:0">${fmt(spent)} spent of your ${fmt(b)} budget (${Math.round(spent/b*100)}%).</p>${cur?'':'<p class="note">Compared with your current budget.</p>'}</div>`}
else v=`<div class="card hero"><p class="lbl">Total spent</p><div class="big">${fmt(spent)}</div><p class="lbl" style="margin:0">No budget is set. Add one in Setup.</p></div>`;
const arr=Array(D).fill(0);l.forEach(e=>arr[+e.date.slice(8,10)-1]+=e.amt);
const bi=arr.indexOf(Math.max(...arr)),cs=byCat(l);
const W=320,H=100,bw=W/D,mxv=Math.max(...arr,b?b/D:0)||1;
const bars=arr.map((x,i)=>x?`<rect x="${(i*bw+1).toFixed(1)}" y="${(H-x/mxv*H).toFixed(1)}" width="${Math.max(bw-2,1).toFixed(1)}" height="${(x/mxv*H).toFixed(1)}" rx="1.5" fill="var(--accent)"/>`:'').join('');
const ly=(H-(b?b/D:0)/mxv*H).toFixed(1);
const line=b?`<line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="4 3"/>`:'';
const lab=[1,8,15,22,D].filter((x,i,a)=>a.indexOf(x)===i&&(x===D||D-x>3)).map(x=>`<text x="${((x-1)*bw+bw/2).toFixed(1)}" y="114" font-size="9" text-anchor="middle" fill="var(--mute)">${x}</text>`).join('');
const top=[...l].sort((a,b)=>b.amt-a.amt).slice(0,5);
return nav+v+`<div class="grid"><div class="card stat"><span class="lbl">Daily average</span><b>${fmt(spent/days)}</b></div><div class="card stat"><span class="lbl">Biggest day</span><b>${fmt(arr[bi])}</b><span class="note">${sdate(m+'-'+p2(bi+1))}</span></div><div class="card stat"><span class="lbl">Expenses</span><b>${l.length}</b></div><div class="card stat"><span class="lbl">Top category</span><b>${esc(cs[0].c.name)}</b></div></div>
<h2>Spending by category</h2><div class="card"><div class="stack">${cs.map(x=>`<i style="width:${x.v/spent*100}%;background:${x.c.color}"></i>`).join('')}</div>${cs.map(x=>`<div class="rw"><i class="dot" style="background:${x.c.color}"></i><span class="grow">${esc(x.c.name)}</span><span class="lbl">${Math.round(x.v/spent*100)}%</span><b>${fmt(x.v)}</b></div>`).join('')}</div>
<h2>Spending by day</h2><div class="card"><svg viewBox="0 0 320 118" width="100%" role="img" aria-label="Spending for each day of the month">${bars}${line}${lab}</svg>${b?'<p class="note">The dashed line is the daily amount that fits your budget.</p>':''}</div>
<h2>Biggest expenses</h2><div class="card">${top.map(e=>`<div class="rw"><i class="dot" style="background:${cat(e.cat).color}"></i><div class="grow"><div>${esc(cat(e.cat).name)}</div><div class="note" style="margin:0">${sdate(e.date)}${e.note?': '+esc(e.note):''}</div></div><b>${fmt(e.amt)}</b></div>`).join('')}</div><h2>All expenses</h2><div class="card">${[...l].sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts).map(e=>`<div class="rw"><i class="dot" style="background:${cat(e.cat).color}"></i><div class="grow"><div>${esc(cat(e.cat).name)}</div><div class="note" style="margin:0">${sdate(e.date)}${e.note?': '+esc(e.note):''}</div></div><b>${fmt(e.amt)}</b><button class="btn ghost sm" data-act="del" data-id="${e.id}">Delete</button></div>`).join('')}</div>${exportCard()}`}

function setup(){
return `<h1>Setup</h1><div class="card"><label class="lbl" for="budget">Monthly budget</label>
<div class="row"><input id="budget" class="field" type="number" inputmode="decimal" min="0" step="any" value="${S.budget||''}" placeholder="Amount"><button class="btn" data-act="savebudget">Save</button></div>
<label class="lbl" for="cur" style="display:block;margin-top:14px">Currency</label>
<select id="cur" class="field" style="margin-top:6px">${['INR','USD','EUR','GBP','AED'].map(c=>`<option ${c===S.cur?'selected':''}>${c}</option>`).join('')}</select></div>
<h2>Categories</h2><div class="card">${S.cats.map(c=>`<div class="rw"><i class="dot" style="background:${c.color}"></i><span class="grow">${esc(c.name)}</span><button class="btn ghost sm" data-act="delcat" data-id="${c.id}">Remove</button></div>`).join('')}
<div class="row" style="margin-top:12px"><input id="newcat" class="field" maxlength="24" placeholder="New category" aria-label="New category"><button class="btn" data-act="addcat">Add</button></div></div>
<h2>Use it like an app</h2><div class="card"><p class="lbl" style="margin:0">Open this page in Chrome, tap the ⋮ menu, then Add to Home screen. For a one-tap quick-add icon, do this while you’re on the Add screen. Your data is saved on this phone, in this browser.</p></div>
<h2>Backup</h2><div class="card"><textarea id="bk" class="field" style="min-height:90px;padding:10px" placeholder="Backup text appears here. Paste a backup here to restore it." aria-label="Backup text"></textarea>
<div class="row"><button class="btn ghost" data-act="backup">Copy backup</button><button class="btn ghost" data-act="restore">Restore</button></div></div>
<p style="margin:22px 0 0"><button class="btn ghost" data-act="reset">Erase all data</button></p>`}

const inFrame=()=>{try{return window.self!==window.top}catch(e){return true}};
const ldate=t=>new Date(+t.slice(0,4),+t.slice(5,7)-1,+t.slice(8,10)).toLocaleDateString('en',{day:'numeric',month:'short',year:'numeric'});
function getX(){const r=(document.querySelector('input[name=xr]:checked')||{}).value||'m',td=today();let from,to,label,key,st=false;
if(r==='m'){from=rm+'-01';to=rm+'-31';label=mlabel(rm);key=rm}
else if(r==='a'){from='0000-00-00';to='9999-99-99';label='All time';key='all';st=true}

async function saveFile(blob,name){

await new Promise(r=>setTimeout(r,800));URL.revokeObjectURL(a.href)}
async function doExport(){const p=$('#xpdf').checked,x=$('#xxls').checked;

for(const [f,n,l] of jobs){for(let k=0;k<4;k++){try{await saveFile(f(),n);toast(l+' saved');break}catch(e){const c=e&&e.code;
if(c==='rate_limited'&&k<3){await new Promise(r=>setTimeout(r,1500));continue}
if(c==='unavailable'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){toast('Saving files isn’t available here. Use Share summary or Copy CSV.');return}
toast(c==='declined'?l+' not saved':'Could not save the '+l+' ('+(c||(e&&e.message)||'error')+')');break}}}}
